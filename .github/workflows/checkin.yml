name: NewAPI 自动签到

on:
  # 定时执行：每天 UTC 0:10 (北京时间 8:10)
  schedule:
    - cron: '10 0 * * *'
  # 手动触发
  workflow_dispatch:

concurrency:
  group: vsllm-automation
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备答题缓存目录
        run: mkdir -p .cache

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 缓存每日答题答案
        uses: actions/cache@v4
        with:
          path: .cache/vsllm-daily-task-answers.json
          key: vsllm-task-answers-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            vsllm-task-answers-${{ runner.os }}-

      - name: 执行签到（含防浪费翻卡与今日任务）
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          VSLLM_DAILY_TASKS: '1'
          VSLLM_DRAW_LIMIT: '12'
          VSLLM_TASK_AD_LIMIT: '3'
          VSLLM_TASK_QUIZ_ATTEMPTS: '8'
          VSLLM_AD_MAX_WAIT_SECONDS: '300'
          VSLLM_REQUEST_INTERVAL_SECONDS: '1'
          VSLLM_SHARE_UNLOCK: '1'
          VSLLM_CLAIM_MODEL_TASK: '0'
          VSLLM_BROWSER_TRANSPORT: '1'
          VSLLM_BROWSER_REQUIRED: '1'
          VSLLM_HEADLESS: '1'
          VSLLM_CF_WAIT_SECONDS: '120'
        run: xvfb-run --auto-servernum python checkin.py
